<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Car Track Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  
  <div id="menu">
    <h1>Car Track Builder</h1>
    <button onclick="novaMapaAEdtor()">Nová mapa</button>
    <button onclick="zobrazNacist()">Načíst mapu</button>

    <div id="seznam-map"></div>
  </div>

  
  <div id="editor" class="hidden">
    <div id="editor-header">
      <button onclick="showMenu()">← Menu</button>
      <input type="text" id="nazev-mapy" placeholder="Název mapy" />
      <button onclick="ulozitMapu()">Uložit</button>
      <button onclick="exportMapu()">Export JSON</button>
      <label>Import JSON <input type="file" id="import-input" accept=".json" onchange="importMapu(event)" /></label>
    </div>

    <div id="toolbar">
      <button class="tile-btn active" style="background:#4a8c3f;color:white" onclick="selectTile(this,'grass')">Tráva</button>
      <button class="tile-btn" style="background:#555;color:white" onclick="selectTile(this,'road')">Silnice</button>
      <button class="tile-btn" style="background:#3a7bd5;color:white" onclick="selectTile(this,'water')">Voda</button>
      <button class="tile-btn" style="background:#e63946;color:white" onclick="selectTile(this,'start')">Start</button>
    </div>

    <div id="grid"></div>
  </div>

<script src="script.js"></script>
</body>
</html>
